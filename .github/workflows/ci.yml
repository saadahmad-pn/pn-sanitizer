name: CI

# Disabled from running automatically while this project is still in
# active development -- every push/PR would otherwise trigger it. Left
# in place, not deleted, so it's a one-line change to re-enable later:
# restore the `pull_request:` / `push:` triggers below. Can still be run
# manually any time via the Actions tab (or `gh workflow run ci.yml`).
on:
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck -S warning -x scripts/*.sh scripts/lib/*.sh

  test-suite:
    name: test suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: bash test/run-all-tests.sh

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $files = Get-ChildItem -Path ./scripts -Filter *.ps1 -Recurse
          $results = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning,Error }
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s) across $($files.Count) file(s)"
            exit 1
          }
          Write-Output "PSScriptAnalyzer: no issues found across $($files.Count) file(s)"

  pester:
    name: Pester (PowerShell unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck -ErrorAction Stop
          $result = Invoke-Pester -Path test/pester -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            exit 1
          }

  json-validity:
    name: JSON validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          set -euo pipefail
          for f in hooks/hooks.json .cursor-plugin/plugin.json .cursor-plugin/marketplace.json; do
            echo "Checking $f"
            jq empty "$f"
          done
